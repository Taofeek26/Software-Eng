services:
  - type: web
    name: movie-app-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: movie-app-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TMDB_API_KEY
        sync: false
      - key: BCRYPT_ROUNDS
        value: 12

databases:
  - name: movie-app-db
    databaseName: movie_app_db
    user: movie_app_user
    plan: free